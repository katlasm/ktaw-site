<div class="wrap">

<script>
/* ============================================================
   MUSCLE DEBT SCORE — quiz engine
   Three branches: glp1 / surgery / natural
   All formulas and copy transcribed from the approved build doc.
   ============================================================ */

const KTAW_CHECKOUT_URL = "https://kgm.thrivecart.com/muscledebt/";
const KTAW_PRICE = 497;

// Kit (ConvertKit) lead capture — calls our own Netlify Function, which holds
// the real Kit API key privately (set in Netlify's environment variables,
// never in this file). The browser never talks to Kit directly, and the key
// never appears anywhere a visitor could view page source and steal it.
async function submitToKit(name, email, branch, gated, resultsURL){
  try{
    const res = await fetch('/.netlify/functions/kit-tag', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, branch, gated, resultsURL })
    });
    if(!res.ok){
      const errBody = await res.text();
      console.error('Kit tagging failed — status', res.status, '— details:', errBody);
    }
  }catch(err){
    console.warn('Kit submission failed silently — do not block the user on this:', err);
  }
}

let state = {
  branch: null,
  step: 0,
  answers: {},
  gated: false
};

const screenEl = document.getElementById('screen');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const brandStep = document.getElementById('brandStep');

function setProgress(current, total, label){
  if(total === 0){
    progressTrack.classList.remove('show');
    progressLabel.classList.remove('show');
    brandStep.textContent = '';
    return;
  }
  progressTrack.classList.add('show');
  progressLabel.classList.add('show');
  progressFill.style.width = Math.round((current/total)*100) + '%';
  progressLabel.textContent = label || `Set ${current} / ${total}`;
  brandStep.textContent = `${current}/${total}`;
}

/* ---------------- QUESTION DEFINITIONS ---------------- */

const branches = {
  glp1: {
    name: "GLP-1 Medication",
    questions: [
      { key:'sex', q:'What\u2019s your sex?', context:'Muscle loss patterns differ by sex \u2014 this keeps your number specific to you, not generic.', type:'choice', options:[['male','Male'],['female','Female']] },
      { key:'age', q:'What\u2019s your age?', context:'The body holds onto muscle differently at 25 than at 55. This adjusts for that, not around it.', type:'number', placeholder:'e.g. 42', suffix:'yrs' },
      { key:'preWeight', q:'What was your weight before you started losing it?', context:'The number before the change started.', type:'number', placeholder:'e.g. 210', suffix:'lbs' },
      { key:'currentWeight', q:'What\u2019s your current weight?', context:'And where you landed. The gap between these two is where the real story is.', type:'number', placeholder:'e.g. 165', suffix:'lbs' },
      { key:'medication', q:'Which medication have you been using, if any?', context:'Different medications pull lean mass at different rates in published trials \u2014 this is where we adjust for which one.', type:'choice', options:[
          ['semaglutide','Semaglutide (Ozempic / Wegovy)'],
          ['tirzepatide','Tirzepatide (Mounjaro / Zepbound)'],
          ['unsure','Not sure']
        ]},
      { key:'months', q:'About how many months has most of this weight loss happened over?', context:'Speed matters as much as amount. Losing it fast costs more muscle than losing it slow, even at the same total.', type:'number', placeholder:'e.g. 8', suffix:'months' },
      { key:'training', q:'During your weight loss, how often did you do resistance/strength training?', context:'This is the single biggest lever in how much of what you lost was muscle versus fat.', type:'choice', options:[
          ['regular','Regularly \u2014 3+ times a week'],
          ['some','Sometimes \u2014 1-2 times a week'],
          ['none','Not at all']
        ]},
      { key:'protein', q:'How would you describe your protein intake during your weight loss?', context:'Protein is the second-biggest lever after training \u2014 published trials show it meaningfully changes how much of what you lose is muscle.', type:'choice', options:[
          ['high','High \u2014 I tracked it or made it a priority'],
          ['moderate','Moderate \u2014 ate reasonably, didn\u2019t really track'],
          ['low','Low \u2014 didn\u2019t think about it much']
        ]},
      { key:'sleep', q:'During this stretch, how would you describe your sleep?', context:'Sleep affects muscle protein synthesis as much as training does \u2014 short sleep changes the ratio of what you lose, even at the exact same total weight.', type:'choice', options:[
          ['good','Consistently 7+ hours'],
          ['moderate','Usually 6-7 hours'],
          ['poor','Regularly under 6 hours']
        ]}
    ],
    gate: {
      q:'Any of these currently true for you?',
      context:'Nothing here unlocks or blocks your result. It just makes sure what we hand you afterward is actually safe for you.',
      type:'multi',
      noneKey:'none',
      options:[
        ['pregnant','Pregnant or trying to conceive'],
        ['fainting','Recent fainting, dizziness, or severe GI symptoms'],
        ['eatingdisorder','History of an eating disorder'],
        ['restricted','A doctor has restricted my activity level'],
        ['none','None of these apply']
      ]
    }
  },
  surgery: {
    name: "Cosmetic Surgery",
    questions: [
      { key:'sex', q:'What\u2019s your sex?', context:'Muscle loss patterns differ by sex \u2014 this keeps your number specific to you, not generic.', type:'choice', options:[['male','Male'],['female','Female']] },
      { key:'age', q:'What\u2019s your age?', context:'Older bodies lose muscle faster during any period of reduced movement. This adjusts for that.', type:'number', placeholder:'e.g. 42', suffix:'yrs' },
      { key:'currentWeight', q:'What\u2019s your current weight?', context:'Used to estimate your starting muscle mass \u2014 the baseline everything else is measured against.', type:'number', placeholder:'e.g. 165', suffix:'lbs' },
      { key:'restriction', q:'How limited was your activity after your procedure?', context:'This is the actual driver here \u2014 not the surgery itself, but how long your body stayed still afterward.', type:'choice', options:[
          ['minimal','Minimal \u2014 walking normally within days'],
          ['moderate','Moderate \u2014 limited exertion for 1-3 weeks'],
          ['significant','Significant \u2014 mostly resting for 3+ weeks']
        ]},
      { key:'weeksSince', q:'How many weeks ago was your procedure?', context:'How long ago this happened, so we know how far into recovery your body actually is.', type:'number', placeholder:'e.g. 6', suffix:'weeks' },
      { key:'protein', q:'How would you describe your protein intake during recovery?', context:'Protein drives tissue repair as much as it drives muscle retention \u2014 this matters here too, not just for people dieting.', type:'choice', options:[
          ['high','High \u2014 I tracked it or made it a priority'],
          ['moderate','Moderate \u2014 ate reasonably, didn\u2019t really track'],

      { key:'sleep', q:'During recovery, how would you describe your sleep?', context:'Poor sleep measurably slows tissue repair and muscle retention \u2014 this matters during recovery just as much as during a diet.', type:'choice', options:[

          ['yes','Yes'],['no','No'],['unsure','Not sure']
        ]}
    ],
    gate: null // clearance question above doubles as the gate
  },
  natural: {
    name: "Proper Nutrition & Exercise",
    questions: [
      { key:'sex', q:'What\u2019s your sex?', context:'Muscle loss patterns differ by sex \u2014 this keeps your number specific to you, not generic.', type:'choice', options:[['male','Male'],['female','Female']] },
      { key:'age', q:'What\u2019s your age?', context:'The body holds onto muscle differently at 25 than at 55. This adjusts for that, not around it.', type:'number', placeholder:'e.g. 42', suffix:'yrs' },
      { key:'preWeight', q:'What was your weight before you started losing it?', context:'The number before the change started.', type:'number', placeholder:'e.g. 210', suffix:'lbs' },
      { key:'currentWeight', q:'What\u2019s your current weight?', context:'And where you landed. The gap between these two is where the real story is.', type:'number', placeholder:'e.g. 165', suffix:'lbs' },
      { key:'months', q:'About how many months did this weight loss happen over?', context:'Speed matters as much as amount. Losing it fast costs more muscle than losing it slow, even at the same total.', type:'number', placeholder:'e.g. 10', suffix:'months' },

          ['regular','Regularly \u2014 3+ times a week'],
          ['some','Sometimes \u2014 1-2 times a week'],
          ['none','Not at all']
        ]},
      { key:'protein', q:'How would you describe your protein intake during your weight loss?', context:'Protein is the second-biggest lever after training \u2014 published trials show it meaningfully changes how much of what you lose is muscle.', type:'choice', options:[
          ['high','High \u2014 I tracked it or made it a priority'],
          ['moderate','Moderate \u2014 ate reasonably, didn\u2019t really track'],
          ['low','Low \u2014 didn\u2019t think about it much']
        ]},
      { key:'sleep', q:'During this stretch, how would you describe your sleep?', context:'Sleep affects muscle protein synthesis as much as training does \u2014 short sleep changes the ratio of what you lose, even at the exact same total weight.', type:'choice', options:[
          ['good','Consistently 7+ hours'],
          ['moderate','Usually 6-7 hours'],
          ['poor','Regularly under 6 hours']

    ],
    gate: {

      noneKey:'none',
      options:[
        ['pregnant','Pregnant or trying to conceive'],
        ['injury','Recent injury or doctor-restricted activity'],
        ['eatingdisorder','History of an eating disorder'],

/* ---------------- FORMULAS ---------------- */

// Age multiplier: muscle retention gets harder with age (anabolic resistance
// begins accelerating in the 40s, more sharply past 60 — Cleveland Clinic,
// sarcopenia literature)
function ageMult(age){
  if(age >= 60) return 1.20;
  if(age >= 40) return 1.10;
  return 1.0;
}

// Rate-of-loss multiplier: slower weight loss preserves lean mass better
// than rapid loss at the same total (Garthe et al. 2011; BJN 2020 meta-analysis)
function rateMult(totalLost, months){
  if(!months || months <= 0) return 1.0;
  const perWeek = totalLost / (months * 4.33);
  if(perWeek < 1) return 0.85;
  if(perWeek <= 2) return 1.0;
  return 1.20;
}

// Protein multiplier: higher protein intake (1.0-1.6 g/kg/day vs ~0.8 g/kg/day
// normal) meaningfully preserves lean mass during a deficit or recovery window
// (Ogilvie et al. 2022; Longland et al. 2016; multiple meta-analyses)
function proteinMult(protein){
  if(protein === 'high') return 0.75;
  if(protein === 'low') return 1.15;
  return 1.0;
}

// Sleep multiplier: a controlled crossover trial found identical caloric
// deficits produced very different results depending on sleep — 5.5h vs 8.5h
// nightly sleep cut fat loss by 55% and increased lean mass loss by 60% for
// the exact same total weight lost (Nedeltcheva et al. 2010, Annals of
// Internal Medicine; replicated in Wang et al. 2018; mechanism confirmed via
// acute drops in muscle protein synthesis, Lamon et al. 2021)
function sleepMult(sleep){
  if(sleep === 'good') return 0.85;
  if(sleep === 'poor') return 1.25;
  return 1.0;
}

function calcGLP1(a){
  const total = a.preWeight - a.currentWeight;
  let base = a.medication === 'semaglutide' ? 0.40 : a.medication === 'tirzepatide' ? 0.25 : 0.32;
  let trainMult = a.training === 'regular' ? 0.35 : a.training === 'some' ? 0.65 : 1.0;
  let rMult = rateMult(total, a.months);
  let aMult = ageMult(a.age);
  let pMult = proteinMult(a.protein);
  let sMult = sleepMult(a.sleep);
  let lost = total * base * trainMult * rMult * aMult * pMult * sMult;
  let pct = total > 0 ? (lost/total)*100 : 0;
  pct = Math.min(pct, 60); // sanity ceiling — stacked multipliers shouldn't imply impossible loss
  lost = total * (pct/100);
  let score = Math.min(100, (pct/45)*100);
  return { lost: Math.round(lost), score: Math.round(score) };
}

function calcSurgery(a){
  const baselineMuscle = a.currentWeight * (a.sex === 'male' ? 0.40 : 0.32);
  let dailyRate = a.restriction === 'minimal' ? 0.0015 : a.restriction === 'moderate' ? 0.0035 : 0.0055;
  let aMult = ageMult(a.age);
  let pMult = proteinMult(a.protein);
  let sMult = sleepMult(a.sleep);
  let pct = Math.min(18, dailyRate * aMult * pMult * sMult * a.weeksSince * 7 * 100);
  let lost = baselineMuscle * (pct/100);
  let score = Math.min(100, (pct/18)*100);
  return { lost: Math.round(lost), score: Math.round(score) };
}

function calcNatural(a){
  const total = a.preWeight - a.currentWeight;
  let trainMult = a.training === 'regular' ? 0.35 : a.training === 'some' ? 0.65 : 1.0;
  let rMult = rateMult(total, a.months);
  let aMult = ageMult(a.age);
  let pMult = proteinMult(a.protein);
  let sMult = sleepMult(a.sleep);
  let lost = total * 0.25 * trainMult * rMult * aMult * pMult * sMult;
  let pct = total > 0 ? (lost/total)*100 : 0;
  pct = Math.min(pct, 60);
  lost = total * (pct/100);
  let score = Math.min(100, (pct/25)*100);
  return { lost: Math.round(lost), score: Math.round(score) };
}

function tierOf(score){
  if(score < 25) return 1;
  if(score < 50) return 2;
  if(score < 75) return 3;
  return 4;
}

  if(q.type === 'choice'){
    screenEl.querySelectorAll('.option').forEach(el=>{
      if(state.answers[q.key] === el.dataset.val) el.classList.add('selected');
      el.onclick = ()=>{

/* ---------------- INIT ---------------- */
/* ---------------- RESULTS RETRIEVAL (for email "see your results again" links) ---------------- */
// No backend exists, so a visitor's exact result is encoded directly into their
// results URL. Revisiting that URL decodes it and jumps straight to results —
// no server, no database, just the same math run again on the same inputs.

function buildResultsURL(){
  const params = new URLSearchParams();
  params.set('branch', state.branch);
  params.set('gated', state.gated ? '1' : '0');
  Object.keys(state.answers).forEach(k=>{
    if(k.startsWith('_')) return; // skip name/email — not needed to recompute, keeps PII out of the URL
    params.set(k, state.answers[k]);
  });
  return window.location.origin + window.location.pathname + '?' + params.toString();
}

function tryLoadResultsFromURL(){
  const params = new URLSearchParams(window.location.search);
  if(!params.has('branch') || !branches[params.get('branch')]) return false;
  state.branch = params.get('branch');
  state.gated = params.get('gated') === '1';
  state.answers = {};
  for(const [k, v] of params.entries()){
    if(k === 'branch' || k === 'gated') continue;
    const num = parseFloat(v);
    state.answers[k] = isNaN(num) ? v : num;
  }
  state.step = 'results';
  return true;
}

/* ---------------- INIT ---------------- */
if(!tryLoadResultsFromURL()){
  state.step = 'landing';
}
render();
